[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentops-backend"
version = "0.1.0"
description = "AgentOps control plane and durable agent run backend"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "jsonschema>=4.23.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
agentops-worker = "agentops_api.worker:main"

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = [
    "apps/api/src",
    "packages/domain/src",
    "packages/persistence/src",
]
include = ["agentops_*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [
    "apps/api/src",
    "packages/domain/src",
    "packages/persistence/src",
]
testpaths = ["apps/api/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = [
    "apps/api/src",
    "packages/domain/src",
    "packages/persistence/src",
]

[[tool.mypy.overrides]]
module = ["jsonschema.*"]
ignore_missing_imports = true
